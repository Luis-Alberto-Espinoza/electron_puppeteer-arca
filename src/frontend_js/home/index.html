<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; 
                 script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
                 style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
                 img-src 'self' data: https:;
                 connect-src 'self' https://cdn.jsdelivr.net;">
    <title>ARCA - AFIP</title>
    <!-- Sistema de diseño: tokens (paleta) primero para que las variables existan -->
    <link rel="stylesheet" href="../estilos/tokens.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
    <!-- Base + componentes compartidos: después de index.css para imponer el fondo de marca -->
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Componente reutilizable: Modal de confirmación -->
    <link rel="stylesheet" href="../utils/confirmModal.css">
    <!-- Componente reutilizable: Lanzador de sesión (abrir navegador logueado) -->
    <link rel="stylesheet" href="../componentes/lanzadorSesion/lanzadorSesion.css">
    <!-- Componente reutilizable: Actualizar clave de un cliente sin ir a Clientes -->
    <link rel="stylesheet" href="../componentes/actualizarClave/actualizarClave.css">
    <!-- Componente reutilizable: Navbar (barra de navegación fija) -->
    <link rel="stylesheet" href="../componentes/navbar/navbar.css">
    <link rel="stylesheet" href="../componentes/configDatos/configDatos.css">
    <link rel="stylesheet" href="../componentes/gestionGrupos/gestionGrupos.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
</head>

<body>
    <div class="general">
        <h1>Sistema AFIP - ARCA</h1>

        <!-- MENÚ PRINCIPAL (oculto: la navegación ahora vive en el navbar).
             Se conservan los botones en el DOM para no romper el cableado de
             inicializarBotonesPrincipales(); el navbar dispara las mismas claves. -->
        <div class="menu-principal" style="display:none;">
            <button id="btnEntrarAfip" class="btn-principal">Entrar a AFIP</button>
            <button id="btnEntrarATM" class="btn-principal">Entrar a ATM</button>
            <button id="btnUsuarios" class="btn-principal">Gestión de Clientes</button>
            <button id="btnExtraerTablasPDF" class="btn-principal">Extraer Tablas PDF</button>
        </div>

        <!-- HOME AFIP (Menú de servicios AFIP) -->
        <div id="homeAfipDiv" class="contenido-oculto">
            <!-- Aquí se cargará el módulo home_AFIP -->
        </div>

        <!-- GENERAR VEP -->
        <div id="generarVEPDiv" class="contenido-oculto">
            <!-- Aquí se cargará el módulo generar_VEP -->
        </div>

        <!-- PLANES DE PAGO -->
        <div id="planesDePagoDiv" class="contenido-oculto">
            <!-- Aquí se cargará el módulo de Planes de Pago -->
        </div>

        <!-- CUENTA TRIBUTARIA (SCT) -->
        <div id="cuentaTributariaDiv" class="contenido-oculto">
            <!-- Aquí se cargará el módulo de Cuenta Tributaria -->
        </div>

        <!-- CONSULTA DE COMPROBANTES EMITIDOS -->
        <div id="consultaComprobantesDiv" class="contenido-oculto">
            <!-- Aquí se cargará el módulo de Consulta de Comprobantes -->
        </div>

        <!-- DECLARACIÓN JURADA -->
        <div id="declaracionJuradaDiv" class="contenido-oculto">
            <!-- Aquí se cargará el módulo de Declaración Jurada -->
        </div>

        <!-- HISTORIAL DE ACCIONES (bitácora) -->
        <div id="historialDiv" class="contenido-oculto">
            <!-- Aquí se cargará el módulo de Historial -->
        </div>

        <!-- PLANTILLAS EXCEL -->
        <div id="plantillasExcelDiv" class="contenido-oculto">
            <!-- Aquí se cargará el módulo de Plantillas Excel -->
        </div>

        <!-- SELECTOR DE USUARIO -->
        <div id="selectorUsuarioDiv" class="contenido-oculto">
            <!-- El controlador.js inyectará aquí el componente selectorUsuarios dinámicamente -->
        </div>
        

        <!-- MÓDULOS AFIP (Se muestran después de seleccionar usuario) -->
        <div id="modulosAfipDiv" class="contenido-oculto">
            <div id="infoUsuarioSeleccionado"></div>
            <div class="seccion" id="facturasSeccion">
                <button id="facturasBtn" class="btn-principal">Realizar Facturas</button>
                <div id="facturasDiv" class="contenido-oculto"></div>
            </div>
            <div class="seccion" id="facturasTipificadasSeccion">
                <button id="btnFacturasTipificadas" class="btn-principal">Facturas Tipificadas</button>
                <div id="facturasTipificadasDiv" class="contenido-oculto"></div>
            </div>
            <div class="seccion" id="lectorMpSeccion">
                <button id="btnLectorMP" class="btn-principal">Lector MercadoPago</button>
                <div id="leerMercadoPagoDiv" class="contenido-oculto"></div>
            </div>
            <!-- Libro IVA: servicio desactualizado e inoperativo → oculto por ahora
                 (no se migra; se deja el DOM para no romper inicializarLibroIVA). -->
            <div class="seccion" id="libroIvaSeccion" style="display:none;">
                <button id="btnLibroIVA" class="btn-principal">Libro IVA</button>
                <div id="libroIvaDiv" class="contenido-oculto"></div>
            </div>
        </div>

        <div id="atmsDiv" class="contenido-oculto">
        </div>

        <div id="usuariosDiv" class="contenido-oculto">
        </div>

        <!-- SOLO VISUALIZAR EL MÓDULO DE EXTRAER TABLAS PDF -->
        <div id="extraerTablasPDFDiv">
            <!-- Aquí se cargará el módulo visual de extraer tablas de PDF -->
        </div>
    </div>

    <!-- Bootstrap JS Bundle (incluye Popper.js) - Necesario para modales -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Componente reutilizable: Modal de confirmación -->
    <script src="../utils/confirmModal.js"></script>
    <!-- Componente reutilizable: Lanzador de sesión (expone window.abrirLanzadorSesion) -->
    <!-- Componente reutilizable: Actualizar clave (expone window.abrirActualizarClave) -->
    <script src="../componentes/actualizarClave/actualizarClave.js"></script>
    <script src="../componentes/lanzadorSesion/lanzadorSesion.js"></script>
    <!-- Componente reutilizable: Navbar (expone window.initNavbar; lo inicializa controlador.js) -->
    <script src="../componentes/navbar/navbar.js"></script>
    <script src="../componentes/configDatos/configDatos.js"></script>
    <script src="../componentes/gestionGrupos/gestionGrupos.js"></script>
    <script>
        // Inicializar el modal de confirmación cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            window.initConfirmModal();
        });
    </script>

    <script type="module" src="../controlador.js"></script>
    <script src="script.js"></script>
    <!-- <script src="../usuario/script_create_Usuario.js" type="module"></script> -->
</body>

</html>
