<div class="planes-container">
    <div class="planes-header">
        <h2>Datos de Planes de Pago</h2>
    </div>

    <!-- Gestión de listas guardadas (ARRIBA) -->
    <div class="planes-seccion planes-gestion-listas">
        <div class="planes-seccion-titulo">Lista de representantes</div>
        <div class="listas-fila">
            <select id="selectListaPlanes" class="planes-select-lista">
                <option value="">-- Sin lista guardada --</option>
            </select>
            <button id="btnNuevaListaPlanes" class="btn planes-btn-lista">+ Nueva</button>
            <button id="btnRenombrarListaPlanes" class="btn planes-btn-lista">Renombrar</button>
            <button id="btnEliminarListaPlanes" class="btn planes-btn-lista planes-btn-lista-eliminar">Eliminar</button>
        </div>
        <div id="panelNombreListaPlanes" style="display:none">
            <div class="nombre-lista-fila">
                <input id="inputNombreListaPlanes" type="text" class="planes-input planes-input-nombre" placeholder="Nombre de la lista..." />
                <button id="btnConfirmarNombrePlanes" class="btn planes-btn-lista planes-btn-confirmar-nombre">Confirmar</button>
                <button id="btnCancelarNombrePlanes" class="btn planes-btn-lista">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Textarea de búsqueda por nombre -->
    <div class="planes-seccion">
        <div class="planes-seccion-titulo">Buscar representantes por nombre <span class="planes-hint">(uno por línea)</span></div>
        <textarea
            id="textareaNombresPlanes"
            rows="6"
            placeholder="Ej:&#10;Luis S.A.&#10;Fideicomiso 5&#10;Empresa XYZ"></textarea>
        <div class="textarea-acciones">
            <button id="btnBuscarSeleccionarPlanes" class="btn planes-btn-buscar-seleccionar">Buscar y seleccionar</button>
            <button id="btnGuardarListaPlanes" class="btn planes-btn-guardar-lista">Guardar lista</button>
        </div>
        <div id="matchResultadoPlanes" style="display:none"></div>
    </div>

    <!-- Tabla de representantes (SelectorUsuarios) -->
    <div id="selector-representantes-planes"></div>

    <!-- Limpiar seleccionados -->
    <div class="planes-controles">
        <button id="btnLimpiarSeleccionPlanes" class="btn planes-btn-limpiar-seleccion">✕ Limpiar seleccionados</button>
    </div>

    <!-- Panel de CUITs por representante: OCULTO (modelo plano, cada fila
         procesa su propio CUIT; ver actualizarPanelesCuits). -->
    <div id="panelCuitsRepresentantes" class="planes-seccion" style="display:none">
        <div class="planes-seccion-titulo">CUITs a procesar por representante</div>
        <div id="contenedorBloquesRepresentantes">
            <!-- Bloques colapsables dinámicos -->
        </div>
    </div>

    <!-- Botón procesar -->
    <div class="planes-procesar">
        <!-- Visible u oculto: se elige una vez para todo el lote. No se guarda. -->
        <!-- Qué planes bajar: vigentes y/o todo lo demás (caducos, cancelados y
             cualquier otra situación que traiga AFIP). Cada grupo va a su carpeta.
             Dos filas horizontales; cada fila es una unidad que no se desarma. -->
        <div class="planes-filtros">
            <div class="planes-filtros-fila">
                <label class="planes-filtro-check"><input type="checkbox" id="chk-planes-vigentes" checked> Planes vigentes</label>
                <label class="planes-filtro-check"><input type="checkbox" id="chk-planes-no-vigentes"> Planes no vigentes (caducos, cancelados y otros)</label>
            </div>
            <!-- Rango por mes de presentación: filtra SOLO a los no vigentes (los
                 vigentes se bajan siempre). Vacío = sin límite. -->
            <div class="planes-filtros-fila planes-rango" id="rangoNoVigentesPlanes">
                <span class="planes-rango-titulo" title="Fecha de presentación del plan. Filtra solo a los no vigentes; vacío = sin límite.">Presentación:</span>
                <!-- desde + hasta: una pareja que baja junta (misma fila, mismo eje) -->
                <div class="planes-rango-campos">
                    <label class="planes-rango-campo"><span>desde</span><input type="month" id="input-rango-desde-planes" disabled></label>
                    <label class="planes-rango-campo"><span>hasta</span><input type="month" id="input-rango-hasta-planes" disabled></label>
                </div>
            </div>
        </div>
        <label class="ui-switch">
            <input type="checkbox" id="chk-visible-planes" checked>
            Mostrar navegador
        </label>
        <!-- Dos caminos: "Ver planes" lista primero y deja elegir (2 vueltas);
             "Descargar directo" baja todo lo que pasa el filtro (1 vuelta). -->
        <div class="planes-botones">
            <button id="btnVerPlanes" class="btn planes-btn-obtener" disabled>
                🔍 Ver planes y elegir
            </button>
            <button id="btnObtenerDatos" class="btn planes-btn-obtener planes-btn-secundario" disabled>
                ▶ Descargar directo
            </button>
        </div>
    </div>

    <!-- Selección de planes (resultado de "Ver planes") -->
    <div id="panelSeleccionPlanes" class="planes-seccion" style="display:none">
        <div class="planes-seccion-titulo">Planes encontrados: marcá cuáles descargar</div>
        <div class="planes-sel-barra">
            <span id="resumenSeleccionPlanes"></span>
            <span class="planes-sel-acciones">
                <button id="btnMarcarTodosPlanes" class="planes-btn-accion">Marcar todos</button>
                <button id="btnDesmarcarTodosPlanes" class="planes-btn-accion">Desmarcar todos</button>
            </span>
        </div>
        <div id="contenedorSeleccionPlanes"></div>
        <div class="planes-sel-pie">
            <button id="btnDescargarSeleccionPlanes" class="btn planes-btn-obtener" disabled>
                ▶ Descargar seleccionados
            </button>
        </div>
    </div>

    <!-- Panel de resultados -->
    <div id="resultadosPlanesDePago" class="planes-seccion" style="display:none">
        <div class="planes-seccion-titulo">Resultados</div>
        <div id="resultadosContenido"></div>
    </div>
</div>
