<!-- Vista: elegir el cliente; el formulario aparece debajo recién con un cliente elegido -->
<div class="vista-facturacion-cliente">
    <h2 class="vista-facturacion-titulo">Facturar</h2>
    <div id="facturacion-selector-usuarios"></div>
</div>
<div id="facturasDiv" class="contenido-oculto">
<h2>Gestión de Facturas</h2>
<form id="facturasForm">
    <div id="selectUsuariosDiv" style="display: flex; justify-content: space-between; align-items: center;">
        <label for="selectUsuarios">Usuario Activo:</label>
        <p id="selectUsuarios" class="usuario-seleccionado-factura"></p>
    </div>
    <div id="empresaDisponible">
        <label for="selectEmpresaDisponible">Empresa Seleccionada:</label>
        <select id="selectEmpresaDisponible"></select>
    </div>
    <div id="puntoDeVentaFacturaContainer">
        <label for="selectPuntoDeVentaFactura">Punto de Venta:</label>
        <select id="selectPuntoDeVentaFactura" name="puntoDeVenta"></select>
    </div>
    <div id="tipoContribuyenteFacturaContainer">
        <label for="selectTipoContribuyenteFactura">Tipo de Contribuyente:</label>
        <select id="selectTipoContribuyenteFactura" name="tipoContribuyenteElegido" required>
            <option value="">Elegí el tipo…</option>
            <option value="B">B - Responsable Inscripto</option>
            <option value="C">C - Monotributo</option>
        </select>
        <!-- Con el select trabado (disabled no viaja en el form), la letra va por acá. -->
        <input type="hidden" id="tipoContribuyenteFacturaTrabado">
        <small id="notaTipoContribuyenteFactura" class="nota-tipo-factura" hidden>Lo define AFIP según el punto de venta.</small>
    </div>
    <div id="tipoActividadDiv">
        <h2>Tipo de Actividad</h2>
        <div>
            <input type="radio" name="Actividad" value="Producto" id="producto">
            <label for="producto">Producto</label>
        </div>
        <div>
            <input type="radio" name="Actividad" value="Servicio" id="servicio">
            <label for="servicio">Servicio</label>
        </div>
    </div>
    <div id="periodoAFacturarDiv">
        <h2>Periodo a Facturar</h2>

        <div id="fechaDelComprobante" style="display: block;">
            <h3>Seleccionar Fecha Del Comprobante</h3>
            <input type="text" id="fechaComprobante" name="fechaComprobante" placeholder="Selecciona un día">
        </div>

        <div id="metodoIngresoDiv">
            <h2>¿Cómo armo las facturas?</h2>
            <label class="opcion-metodo">
                <input type="radio" name="metodoIngreso" value="manual" id="ingresoManual" checked>
                Repartir un total en el mes
                <small>Elegís el mes, qué días y el monto total: la app lo divide en una factura por día.</small>
            </label>
            <label class="opcion-metodo">
                <input type="radio" name="metodoIngreso" value="masivo" id="ingresoMasivo">
                Pegar fechas y montos desde Excel
                <small>Copiá las columnas de fechas y de montos de tu planilla y pegalas: una factura por fila.</small>
            </label>
        </div>
        <div id="seccionManual">
            <div class="periodo-selects">
                <div>
                    <label for="periodoFactura">Período:</label>
                    <!-- Calendario común en modo período (lo arma index_01.js). El formulario
                         sigue mandando mes y anio: los dos ocultos los llena el calendario. -->
                    <input type="text" id="periodoFactura" placeholder="mes y año">
                    <input type="hidden" name="mes" id="selectMes">
                    <input type="hidden" name="anio" id="selectAnio">
                </div>
            </div>
            <!-- crear un div con el titulo "Preseleccion de fechas que abarque a los tres name="periodoFacturacion" " -->
            <div>
                <h2>Preselección de fechas</h2>

                <div>
                    <input type="radio" name="periodoFacturacion" value="total" id="periodoTotal" data-target="">
                    <label for="periodoTotal">Todos los Dias del mes</label>
                </div>

                <div>
                    <input type="radio" name="periodoFacturacion" value="habiles" id="periodoDiasHabiles"
                        data-target="">
                    <label for="periodoDiasHabiles">Días de Lunes a Viernes</label>
                </div>

                <div>
                    <input type="radio" name="periodoFacturacion" value="manual" id="periodoManual"
                        data-target="calendario">
                    <label for="periodoManual">Seleccionar ciertos días del mes</label>
                    <br>
                    <div id="calendario" style="display: none;">
                        <input type="text" id="datepicker" style="display: none;" placeholder="Selecciona días">
                    </div>
                    <textarea name="fechasFacturas" id="fechasFacturas" class="textAreaFechas"
                        style="display: none;"></textarea>
                </div>
            </div>
            <div id="montoAFacturarDiv">
                <h2>Total a facturar</h2>
                <div id="inputContainerTotal">
                    <input type="hidden" name="tipoMonto" value="montoTotal">
                    <label for="montoTotalInput">Monto total del mes</label>
                    <input type="number" id="montoTotalInput" name="montoTotalInput" placeholder="Monto Total" />
                </div>
            </div>
        </div>

        <div id="seccionMasiva" style="display: none;">
            <div class="columnas-pegado">
                <div>
                    <label for="textareaFechas">Fechas (una por línea):</label>
                    <textarea id="textareaFechas" rows="10" placeholder="DD/MM/YYYY"></textarea>
                </div>
                <div>
                    <label for="textareaMontos">Montos (uno por línea):</label>
                    <textarea id="textareaMontos" rows="10" placeholder="Monto de cada fecha"></textarea>
                </div>
            </div>
        </div>
    </div>

    <button id="procesarFacturas" type="submit">Procesar </button>
</form>
<div id="respuesta">
    <textarea id="codigoLocalStorage" style="display: none; width: 100%; height: 200px; resize: vertical;"></textarea>
    <button id="copiarCodigo" style="display: none;">Copiar Código</button>
</div>
<div id="ejecutaNavegador">
    <!--
                        <button id="testButton">Abrir AFIP en Modo Test</button>
                        <button id="loginButton">Abrir AFIP con Puppeteer</button>
                        -->
</div>
<div class="container">
    <div id="hacerFacturaFacturas" class="hacerFacturaFacturas hidden">
        <button id="habilitarBtnAFIP" class="btn-principal">Hacer Facturas</button>
    </div>
    <div id="botones-puppeteer">
        <!-- Lanzador (componentes/lanzadorAutomatizacion) lo arma autenticacion/auth.js -->
        <div id="lanzadorFactura"></div>
    </div>
</div>
</div><!-- /#facturasDiv -->
</body>

</html>
