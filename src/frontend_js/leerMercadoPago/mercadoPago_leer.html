<!-- Vista: elegir el cliente; el formulario aparece debajo recién con un cliente elegido -->
<div class="vista-facturacion-cliente">
    <h2 class="vista-facturacion-titulo">Facturar Mercado Pago</h2>
    <div id="mp-selector-usuarios"></div>
</div>
<div id="leerMercadoPagoDiv" class="contenido-oculto">
    <div class="container">
        <!-- NUEVO: Usuario y empresa seleccionada para MercadoPago -->
        <div id="selectUsuariosDivMP" style="display: flex; justify-content: space-between; align-items: center;">
            <label for="selectUsuariosMP">Usuario Activo:</label>
            <p id="selectUsuariosMP" class="usuario-seleccionado-factura"></p>
        </div>
        <div id="empresaDisponibleMP">
            <label for="selectEmpresaDisponibleMP">Empresa Seleccionada:</label>
            <select id="selectEmpresaDisponibleMP"></select>
        </div>
        <div id="puntoDeVentaMPContainer">
            <label for="selectPuntoDeVentaMP">Punto de Venta:</label>
            <select id="selectPuntoDeVentaMP"></select>
        </div>
        <div id="fechaDelComprobanteMP">
            <h2>Fecha del comprobante</h2>
            <input type="text" id="fechaComprobanteMP" name="fechaComprobanteMP" placeholder="Selecciona un día">
        </div>
        <div id="tipoActividadDivMP">
            <h2>Tipo de Actividad</h2>
            <div>
                <input type="radio" name="ActividadMP" value="Producto" id="productoMP">
                <label for="productoMP">Producto</label>
            </div>
            <div>
                <input type="radio" name="ActividadMP" value="Servicio" id="servicioMP">
                <label for="servicioMP">Servicio</label>
            </div>
        </div>
    </div>

    <div class="container">
        <h2 class="title">Leer resumen de cuenta personal de Mercado Pago</h2>
        <div class="file-selection-section">
            <button id="btn-seleccionar-archivo" class="btn">Seleccionar Archivo</button>
            <div id="ruta-seleccionada-container" class="ruta-container hidden">
                <input type="text" id="ruta-seleccionada-input" class="input-ruta" readonly>
            </div>
            <button id="btn-procesar-archivo" class="btn hidden">Procesar</button>
        </div>
        <div id="resultados-container" class="resultados-container hidden">
            <h2 class="subtitle">Resultados y Estadisticas</h2>
            <div class="result-box"></div>
        </div>
        <div id="tablas-container" class="tablas-container hidden">
            <div class="table-box">
                <!-- Las tablas se generarán dinámicamente -->
            </div>
            <div class="table-box">
                <!-- Las tablas se generarán dinámicamente -->
            </div>
        </div>
    </div>
    <!-- Lo que se va a facturar y el aviso de fechas: lo arma Procesar -->
    <div id="avisosMP"></div>
    <!-- Lanzador (componentes/lanzadorAutomatizacion) lo arma autenticacion/auth.js;
         aparece cuando Procesar sale bien -->
    <div id="lanzadorFacturaMP" class="contenido-oculto"></div>
</div><!-- /#leerMercadoPagoDiv -->
