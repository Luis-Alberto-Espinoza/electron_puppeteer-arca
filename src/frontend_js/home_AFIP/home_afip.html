<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home AFIP</title>
</head>
<body>
    <div class="contenedor-home-afip">
        <h2 class="titulo-home-afip">Servicios AFIP</h2>
        <p class="descripcion-home-afip">Seleccione el servicio que desea utilizar</p>

        <button id="btnLanzadorAfip" class="btn-lanzador-afip">
            <span class="icono-btn">🚀</span>
            <span class="lanzador-card-texto">
                <span class="texto-btn">Abrir sesión AFIP</span>
                <span class="descripcion-btn">Elegí un cliente y abrí el navegador ya logueado</span>
            </span>
        </button>

        <div class="botones-home-afip">
            <button id="btnGenerarVEP" class="btn-servicio-afip">
                <span class="icono-btn">💳</span>
                <span class="texto-btn">Autónomos - Monotributos</span>
                <span class="descripcion-btn">Generar VEP</span>
            </button>

            <button id="btnGenerarFactura" class="btn-servicio-afip">
                <span class="icono-btn">📄</span>
                <span class="texto-btn">Generar Factura</span>
                <span class="descripcion-btn">Comprobantes electrónicos</span>
            </button>

            <button id="btnPlanesDePago" class="btn-servicio-afip">
                <span class="icono-btn">📋</span>
                <span class="texto-btn">Planes de Pago</span>
                <span class="descripcion-btn">Datos de Planes de Pago</span>
            </button>

            <button id="btnCuentaTributaria" class="btn-servicio-afip">
                <span class="icono-btn">🧾</span>
                <span class="texto-btn">Cuenta Tributaria</span>
                <span class="descripcion-btn">Consulta SCT y generación de VEP</span>
            </button>

            <button id="btnConsultaComprobantes" class="btn-servicio-afip">
                <span class="icono-btn">🔍</span>
                <span class="texto-btn">Consulta de Comprobantes</span>
                <span class="descripcion-btn">Comprobantes emitidos por rango de fechas</span>
            </button>

            <button id="btnDeclaracionJurada" class="btn-servicio-afip">
                <span class="icono-btn">📄</span>
                <span class="texto-btn">Declaración Jurada</span>
                <span class="descripcion-btn">Carga de DDJJ desde Excel en Mis Aplicaciones Web</span>
            </button>
        </div>
    </div>
</body>
</html>
